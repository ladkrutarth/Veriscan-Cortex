# Veriscan-Cortex — package metadata, src-layout config and tool settings.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veriscan-cortex"
version = "1.0.0"
description = "Advanced Fraud Intelligence & Private Multi-Agent Dashboard"
readme = "README.md"
# The dashboard/API currently run on the macOS system Python 3.9; keep code 3.9-compatible.
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "PyYAML>=6.0",
    "chromadb>=0.4.0",
    "sentence-transformers",
    "huggingface-hub",
    "pypdf>=4.0.0",
    "pypdfium2>=4.0.0",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "rapidocr-onnxruntime>=1.3.0",
    "streamlit>=1.30.0",
    "plotly>=5.15.0",
]

[project.optional-dependencies]
mlx = ["mlx-lm"]
snowflake = ["snowflake-connector-python>=3.0.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "httpx>=0.24", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agents*", "api*", "core*", "models*"]

[tool.setuptools]
py-modules = ["paths"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit", "tests/api"]
addopts = "-q"
markers = ["slow: needs real models or large data (deselect with -m 'not slow')"]

[tool.ruff]
target-version = "py39"
line-length = 110
src = ["src", "app", "scripts", "tests"]
extend-exclude = ["notebooks", "poster", ".chroma_db*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # long lines: handled by the formatter where possible
    "B008",    # FastAPI Depends()/Query() in defaults
    "RUF001", "RUF002", "RUF003",  # unicode arrows/dashes in strings and comments are intentional
    "UP006", "UP007", "UP035", "UP045",  # keep typing.Optional/List: pydantic evaluates them on 3.9
    "E712",    # `series == True` is element-wise pandas, not a truthiness check
    "RUF012",  # class-level constant tables are read-only by convention
    "RUF005",  # list concatenation is clearer than unpacking here
]

[tool.ruff.lint.per-file-ignores]
# Standalone scripts put src/ on sys.path before importing project modules.
"tests/evaluate_*.py" = ["E402"]
"src/models/evaluate_*.py" = ["E402"]
"app/streamlit_app.py" = ["E402", "W291", "W293", "SIM117"]  # trailing spaces live inside HTML/CSS strings

[tool.ruff.lint.isort]
known-first-party = ["agents", "api", "core", "models", "paths"]
